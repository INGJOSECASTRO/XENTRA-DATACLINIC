# Integración continua: en cada push/pull request corre las pruebas del backend
# (contra PostgreSQL real) y compila el frontend.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xentra
          POSTGRES_PASSWORD: xentra
          POSTGRES_DB: xentra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xentra" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Pruebas (SQLite)
        run: pytest -q
      - name: Pruebas (PostgreSQL con triggers)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://xentra:xentra@localhost:5432/xentra_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
