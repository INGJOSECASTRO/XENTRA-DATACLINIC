server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    # Resolución dinámica: Nginx arranca y sirve la aplicación aunque la API esté caída o reiniciándose
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8000;

    # La API se reenvía al contenedor del backend
    location /api/ {
        proxy_pass $api;
        proxy_read_timeout 120s;
        error_page 502 503 504 = @api_no_disponible;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación interactiva de la API
    # (Swagger carga recursos de un CDN, por eso aquí no se aplica la CSP estricta)
    location ~ ^/(docs|redoc|openapi.json|fhir) {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass $api;
    }

    # Mensaje claro (y no una pantalla en blanco) si la API no responde
    location @api_no_disponible {
        default_type application/json;
        return 503 '{"detail":"El servidor de XENTRA no responde en este momento. Si persiste, active el plan de contingencia y reporte a soporte.","sin_servicio":true}';
    }

    # SPA: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
