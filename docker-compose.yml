# XENTRA DATACLINIC
#   Desarrollo / pruebas:  docker compose up -d --build
#   Producción (HTTPS):    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # crea el usuario sin privilegios (solo la primera vez)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # La BD NO se expone. Para conectarse desde su PC (pgAdmin/DBeaver) descomente SOLO en desarrollo:
    # ports:
    #   - "127.0.0.1:5432:5432"

  # Aplica las migraciones (Alembic) con el usuario dueño y termina.
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_MIGRACIONES}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      AUTO_CREAR_TABLAS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Respaldo diario comprimido (formato custom de pg_dump) en ./backups, con rotación.
  respaldo:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-14}
      TZ: America/Bogota
    volumes:
      - ./backups:/backups
      - ./db/respaldo.sh:/respaldo.sh:ro
    entrypoint: ["/bin/sh", "/respaldo.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
